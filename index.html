<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="theme-color" content="#04182b">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynamic NEU – Trợ lý sinh viên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DYNAMIC NEU — Design System
   Màu: biển sâu (#04182b) + vàng đồng (#e9c46a) + ngọc lam (#5fd3e0)
   ============================================================ */
:root{
  --bg:#04182b;
  --bg-soft:#071f36;
  --surface:#0b2542;
  --surface-2:#0e2c4d;
  --ink:#eaf3fb;
  --muted:#a3bad3;
  --line:rgba(233,196,106,.18);
  --line-strong:rgba(233,196,106,.38);
  --brand:#5fd3e0;
  --brand-ink:#04202b;
  --accent:#e9c46a;
  --accent-ink:#14233a;
  --danger:#e8452c;
  --ok:#18a37b;
  --soft:#123456;
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
  --shadow-sm:0 6px 18px -12px rgba(0,0,0,.7);
  --shadow:0 18px 40px -24px rgba(0,0,0,.85);
  --shadow-lg:0 28px 60px -30px rgba(0,0,0,.9);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:#04182b;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  line-height:1.65;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
}
/* Nền biển sâu tĩnh lặng, không dùng ảnh base64 nặng */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(95,211,224,.10), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(233,196,106,.08), transparent 55%),
    linear-gradient(180deg,#04182b 0%,#04182b 60%,#03121f 100%);
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- Layout ---------- */
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.app{max-width:640px;margin:0 auto;padding-bottom:96px;min-height:100vh}
.app .wrap{max-width:640px}
.app section{padding:20px 0}
h1,h2,h3,.sec-t,.hello{font-family:"Playfair Display","Be Vietnam Pro",Georgia,serif;letter-spacing:.01em;line-height:1.15}
h1{font-size:clamp(2rem,5.4vw,3.4rem);margin:0 0 14px;font-weight:700;max-width:16ch}
h2{font-size:clamp(1.4rem,3.2vw,1.9rem);margin:0 0 6px;color:#f6e7bd;font-weight:700}
h3{font-size:1.05rem;margin:0 0 8px;font-weight:600;color:#f6e7bd}
p{margin:0 0 12px}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch;font-size:.96rem}
.sec-t{font-size:1.15rem;font-weight:700;margin:22px 16px 8px;color:#f6e7bd}

/* ---------- Header ---------- */
.hd{max-width:640px;margin:0 auto;padding:0;background:none;border-radius:0}
.kv{position:relative;overflow:hidden;border-radius:0 0 26px 26px}
.kv img{width:100%;max-height:420px;object-fit:cover;object-position:center top;display:block}
.kv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,24,43,.15) 0%,rgba(4,24,43,.55) 55%,rgba(4,24,43,.97) 100%)}
.hrow{position:relative;z-index:2;padding:0 16px;margin-top:-34px;display:flex;gap:12px;align-items:center}
.logo{width:52px;height:52px;border-radius:50%;background:#fff;padding:3px;flex:none;box-shadow:0 8px 24px -12px rgba(0,0,0,.9);border:2px solid rgba(233,196,106,.6)}
.sbox{
  flex:1;display:flex;align-items:center;gap:10px;min-width:0;
  background:rgba(8,32,56,.86);
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:0 16px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow-sm);
}
.sbox input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);padding:13px 0;width:100%;min-width:0}
.sbox input::placeholder{color:var(--muted)}
.hello{margin:16px 18px 0;color:#f6e7bd;font-size:1.2rem;font-weight:700}
.hello small{display:block;font-family:"Be Vietnam Pro",sans-serif;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px;line-height:1.5}
body.is-inner .kv img{max-height:160px}
body.is-inner .hello{display:none}
body.is-inner .hrow{margin-top:-24px}

/* ---------- Tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:18px 16px 6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;font:inherit;font-size:.8rem;font-weight:500;color:var(--ink);cursor:pointer;text-align:center;line-height:1.25;transition:transform .18s ease}
.ti{width:60px;height:60px;border-radius:20px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.8rem;box-shadow:var(--shadow-sm);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.tile:hover .ti,.tile:focus-visible .ti{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-2px)}
.tile:active .ti{transform:scale(.95)}

/* ---------- Quick cards ---------- */
.qc{display:flex;gap:12px;overflow-x:auto;padding:14px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.qcard{min-width:214px;flex:none;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)}
.qcard small{display:block;color:var(--muted);font-size:.76rem;margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em}
.qcard b{font-size:.98rem;font-weight:700;color:var(--ink)}

/* ---------- Gallery ---------- */
.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 16px 6px;scrollbar-width:thin}
.gi{flex:none;width:min(78vw,320px);scroll-snap-align:center;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s ease,border-color .2s ease}
.gi:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.gi img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.gcap{margin:10px 18px 0;color:var(--muted);font-size:.84rem;line-height:1.6}
.tg{margin:12px 16px -2px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- Tabs / chips ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer;transition:all .16s ease}
.tab:hover{border-color:var(--line-strong)}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.86rem;cursor:pointer;margin:0 6px 8px 0;transition:all .16s ease}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}

/* ---------- Tools panel ---------- */
.tools{background:rgba(11,37,66,.92);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
#v-quanh .tools{position:static;top:0;z-index:8}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.row label{font-size:.86rem;font-weight:500}
input[type=range]{accent-color:var(--brand);width:200px;vertical-align:middle}
.count{color:var(--muted);font-size:.86rem;margin-left:auto}
.rd{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.sorts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.sbox.mini{margin:8px 0 0;max-width:100%;flex:1;min-width:220px}

/* ---------- Cards / list ---------- */
.list{display:grid;gap:12px}
.card{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);transition:border-color .16s ease,transform .16s ease}
.card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.dist{text-align:center;background:var(--soft);border-radius:12px;padding:8px 4px;font-weight:800;line-height:1.2;font-size:.95rem}
.dist small{display:block;font-weight:500;color:var(--muted);font-size:.7rem;margin-top:2px}
.card h3{margin:0;font-size:1rem}
.card .a{color:var(--muted);font-size:.88rem}
.card .meta{font-size:.86rem;margin-top:4px;line-height:1.55}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:1px 9px;font-size:.75rem;margin-right:6px}
.cl{display:flex;flex-direction:column;gap:6px}
.map,.map2{border:1px solid var(--line-strong);color:var(--ink);text-decoration:none;font-size:.84rem;font-weight:600;padding:8px 12px;border-radius:10px;text-align:center;white-space:nowrap;background:transparent;font:inherit;cursor:pointer;transition:all .16s ease}
.map{background:linear-gradient(135deg,#f3d681,#d6a636);color:#14233a;border:0}
.map:hover,.map2:hover{filter:brightness(1.08);text-decoration:none}
.sep{margin:18px 0 4px;font-weight:700;color:var(--muted);font-size:.88rem}

/* ---------- Panels / forms ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 4px;font-size:1.1rem}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.two{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
label.l{font-size:.86rem;font-weight:500;display:flex;justify-content:space-between;margin-top:6px}
input[type=number],input[type=text],input[type=date],input[type=search],select.sel{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--bg-soft);color:var(--ink);font:inherit;margin:6px 0 14px;min-width:0;
  transition:border-color .16s ease,box-shadow .16s ease;
}
input:focus,select.sel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(95,211,224,.2)}
input::placeholder{color:var(--muted)}
.btn{background:linear-gradient(135deg,#f3d681,#d6a636);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;transition:all .18s ease;box-shadow:var(--shadow-sm)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong);box-shadow:none}
.btn.ghost:hover{background:var(--soft);filter:none}

/* ---------- Chi tiêu ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:.76rem;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:1.05rem;font-weight:700}
.verdict{border-radius:14px;padding:14px 16px;font-weight:600;margin-bottom:14px;font-size:.92rem;line-height:1.55}
.v-good{background:rgba(24,163,123,.16);color:#8ff0cf;border:1px solid rgba(24,163,123,.4)}
.v-mid{background:rgba(233,196,106,.14);color:#f5dfa5;border:1px solid rgba(233,196,106,.4)}
.v-bad{background:rgba(232,69,44,.16);color:#ffb3a3;border:1px solid rgba(232,69,44,.4)}
.brow{margin:10px 0;font-size:.86rem}
.brow .t{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.track{height:10px;background:var(--soft);border-radius:99px;position:relative;margin-top:3px;overflow:visible}
.track i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.tips{margin:8px 0 0;padding-left:18px;color:var(--ink);font-size:.9rem}
.tips li{margin:6px 0}
.exp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.exp:last-child{border-bottom:0}
.exp button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.15rem;line-height:1;padding:2px 8px;border-radius:8px;transition:all .16s ease}
.exp button:hover{color:var(--danger);background:rgba(232,69,44,.12)}
details.setup>summary{font-weight:600;color:var(--ink);margin-bottom:10px;cursor:pointer;font-size:.92rem}
.x-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.x-actions .btn{flex:1;min-width:140px}

/* ---------- Dishes ---------- */
.dish{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;transition:border-color .16s ease}
.dish:hover{border-color:var(--line-strong)}
.dish small{display:block;color:var(--muted);font-size:.8rem}
.price{font-weight:800;white-space:nowrap;color:var(--accent)}
.near-list{margin-top:14px}
.near-list .sub{margin:8px 0 0}

/* ---------- Route ---------- */
.bus{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.route{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)}
.route .no{display:inline-block;background:linear-gradient(135deg,#f3d681,#d6a636);color:#14233a;font-weight:800;border-radius:8px;padding:1px 10px;margin-right:8px;font-size:.92rem}
.route small{display:block;color:var(--muted);margin-top:4px;font-size:.82rem}
.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--muted);font-size:.86rem;margin-top:16px;line-height:1.6}

/* ---------- Chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px;max-height:min(56vh,440px);overflow:auto;margin-bottom:14px;padding-right:4px;scrollbar-width:thin}
.msg{white-space:pre-wrap;padding:11px 15px;border-radius:16px;max-width:90%;font-size:.92rem;line-height:1.6}
.msg.ai{background:var(--soft);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:linear-gradient(135deg,#f3d681,#d6a636);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:6px;font-weight:500}
.ask{display:flex;gap:8px}
.ask input{margin:0;flex:1}
#c-quick{margin-bottom:8px}

/* ---------- Bottom nav ---------- */
.bnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(4,22,40,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line-strong);
  display:flex;justify-content:center;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 30px -20px #000;
}
.bnav div{display:flex;width:100%;max-width:640px}
.bnav button{flex:1;background:transparent;border:0;font:inherit;font-size:.7rem;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;transition:color .16s ease}
.bnav button span{font-size:1.35rem;line-height:1}
.bnav button[aria-current="page"]{color:var(--accent);font-weight:700}
.bnav button:hover{color:var(--ink)}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:.84rem}

/* ---------- Utility ---------- */
[hidden]{display:none!important}
.qlink{display:block;margin:10px 16px 0;color:var(--accent);font-size:.88rem;font-weight:600}
#f-res{display:block;margin-top:12px;line-height:1.55;font-weight:700;color:#f6e7bd}
#gmap{box-shadow:var(--shadow-sm)}
#mapsvg{border:1px solid var(--line)}

/* ---------- Responsive ---------- */
@media(max-width:760px){
  .two{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(4,1fr);gap:14px 6px}
  .ti{width:54px;height:54px;font-size:1.55rem;border-radius:18px}
  .tile{font-size:.74rem}
}
@media(max-width:640px){
  .card{grid-template-columns:78px 1fr}
  .cl{grid-column:1/-1;flex-direction:row}
  .cl a,.cl button{flex:1}
  .count{margin-left:0}
  .hrow{margin-top:-28px}
  .logo{width:46px;height:46px}
  .hello{font-size:1.1rem}
  input[type=range]{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
