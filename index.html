<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Thử Đồ 3D (Virtual Try-On Room)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #141414;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Khung hiển thị mô hình */
        model-viewer {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #2c2c2c 0%, #121212 100%);
        }

        /* Thanh Menu chọn quần áo bên phải */
        .closet-menu {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 220px;
        }

        h3 {
            color: #fff;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Các nút bấm chọn đồ */
        .cloth-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: left;
        }

        .cloth-option:hover {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
            transform: translateX(-5px);
        }

        .cloth-option.active {
            background: #28a745;
            color: #fff;
            border-color: #28a745;
            font-weight: bold;
        }

        /* Hướng dẫn dưới màn hình */
        .tip {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Khung hiển thị mô hình 3D - Mặc định load bộ trang phục số 1 -->
    <model-viewer 
        id="avatar-viewer"
        src="https://githubusercontent.com" 
        alt="Mô hình người thử đồ 3D" 
        camera-controls 
        shadow-intensity="1.5"
        shadow-softness="0.5"
        exposure="1.0"
        environment-image="neutral"
        ar>
    </model-viewer>

    <!-- Tủ đồ để chọn thay đổi áo quần -->
    <div class="closet-menu">
        <h3>Tủ Đồ 3D Online</h3>
        
        <button class="cloth-option active" onclick="changeOutfit(this, 'casual')">
            👗 1. Đồ Thường Nhật (Gốc)
        </button>
        
        <button class="cloth-option" onclick="changeOutfit(this, 'blazer')">
            🧥 2. Áo Khoác Blazer
        </button>
        
        <button class="cloth-option" onclick="changeOutfit(this, 'patchwork')">
            🎨 3. Áo Khoác Họa Tiết
        </button>
    </div>

    <div class="tip">Xoay chuột để xem form dáng quần áo ở các góc độ</div>

    <!-- Nhúng thư viện kết xuất của Google -->
    <script type="module" src="https://googleapis.com"></script>

    <script>
        // Danh sách các link file mô hình quần áo đã được mặc sẵn lên người tương ứng
        const outfits = {
            'casual': 'https://githubusercontent.com',
            'blazer': 'https://githubusercontent.com',
            'patchwork': 'https://githubusercontent.com'
        };

        function changeOutfit(buttonElement, outfitKey) {
            const viewer = document.getElementById('avatar-viewer');
            
            // 1. Cập nhật link mô hình mới dựa trên nút bấm
            viewer.src = outfits[outfitKey];
            
            // 2. Đổi trạng thái hiển thị màu sắc nút Active
            document.querySelectorAll('.cloth-option').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }
    </script>
</body>
</html>
